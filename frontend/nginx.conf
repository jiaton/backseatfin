events {}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # Resolve the backend through Docker's DNS at request time (not once at startup), so
  # recreating only the backend container doesn't leave nginx pointing at a dead IP.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # The access log, as nginx's usual "combined" but without the pairing id a car polls
  # with (/api/auth/pairings/<id>: it collects the car's sign-in).
  map $request_uri $logged_uri {
    ~^(?<pre>/api/auth/pairings/)(?!approve)[^?]+(?<post>.*)$ $pre...$post;
    default $request_uri;
  }
  log_format redacted '$remote_addr - $remote_user [$time_local] "$request_method $logged_uri $server_protocol" '
                      '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
  access_log /var/log/nginx/access.log redacted;

  # The car host (Emby with the car player added) lives in templates/car-host.conf.template;
  # the image's entrypoint fills in EMBY_URL and writes it here.
  include /etc/nginx/conf.d/*.conf;

  # The admin site: the management UI, the car test page, pairing, and the API.

  server {
    listen 80;
    set $backend http://backend:8000;

    # JSMpeg WebSocket stream: upgrade, no buffering, and no read timeout — a movie is
    # one long-lived connection.
    location /api/stream/ws {
      proxy_pass $backend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_buffering off;
      proxy_read_timeout 6h;
      proxy_send_timeout 6h;
    }

    # Progressive MP4 stream (the <video> control case): unbuffered, long-lived.
    location /api/stream/ {
      proxy_pass $backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_buffering off;
      proxy_read_timeout 6h;
    }

    location /api/ {
      proxy_pass $backend;
      proxy_set_header Host $host;
      proxy_set_header User-Agent $http_user_agent;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      # Pass Caddy's value through (nginx itself only ever sees http); the backend uses
      # it to decide whether the session cookie is Secure.
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location = /health {
      proxy_pass $backend;
    }

    # Hashed build output never changes under the same name: cache it for good.
    location /assets/ {
      root /usr/share/nginx/html;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Everything else (the HTML pages, and inject.js, which Emby's page on the car host
    # loads by a fixed name) must be revalidated so an update reaches the car at once.
    location / {
      root /usr/share/nginx/html;
      add_header Cache-Control "no-cache";
      # /play → play.html (the Emby car player); anything else → the admin SPA.
      try_files $uri $uri.html /index.html;
    }
  }
}

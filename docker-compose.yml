# BackseatFin for Emby. Configure with .env (copy .env.example), then: docker compose up -d
#   frontend: the car host (Emby + the car player). All you need: Emby transcodes.
#   backend:  the optional BackseatFin server (YouTube, HDR tone mapping, the admin
#             site). Turn it on with COMPOSE_PROFILES=server in .env.
name: backseatfin

services:
  backend:
    image: ghcr.io/jiaton/backseatfin-server:${BACKSEATFIN_VERSION:-latest}
    build: ./backend
    profiles: [server]
    env_file: .env
    volumes:
      - data:/app/data
      # Downloaded YouTube videos. Emby must see them at the same path (LIBRARY_ROOT).
      - ${YOUTUBE_LIBRARY_DIR:-./youtube-library}:/media/youtube
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  frontend:
    image: ghcr.io/jiaton/backseatfin-web:${BACKSEATFIN_VERSION:-latest}
    build: ./frontend
    environment:
      EMBY_URL: ${EMBY_URL:?Set EMBY_URL in .env}
    ports:
      - ${CAR_PORT:-8097}:8080
      - ${ADMIN_PORT:-8098}:80
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  data:

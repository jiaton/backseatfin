# BackseatFin. Configure with .env (copy .env.example), then: docker compose up -d
#   frontend: nginx. Port CAR_PORT is the Emby car host (Emby + the car player; all an
#             Emby user needs, Emby transcodes). Port APP_PORT is the BackseatFin app
#             (YouTube in the car, settings), served when the server runs.
#   backend:  the BackseatFin server: YouTube in the car (browse, follow, play live),
#             HDR tone mapping for Emby. Turn it on with COMPOSE_PROFILES=server.
name: backseatfin

services:
  backend:
    image: ghcr.io/jiaton/backseatfin-server:${BACKSEATFIN_VERSION:-latest}
    build: ./backend
    profiles: [server]
    env_file: .env
    volumes:
      - data:/app/data
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  frontend:
    image: ghcr.io/jiaton/backseatfin-web:${BACKSEATFIN_VERSION:-latest}
    build: ./frontend
    environment:
      # Without Emby (YouTube only), the car host just has nothing to show.
      EMBY_URL: ${EMBY_URL:-http://emby.invalid:8096}
    ports:
      - ${CAR_PORT:-8097}:8080
      - ${APP_PORT:-${ADMIN_PORT:-8098}}:80
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  data:
